<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>upload — PengyShare</title>
<style>
  :root { --bg: #ffffff; --fg: #1f2328; --accent: #0969da; --border: #d0d7de; --card: #f6f8fa; --hover: #e8ecf0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
         background: var(--bg); color: var(--fg); max-width: 640px; margin: 0 auto; padding: 1.5rem 1rem; }
  h1 { font-size: 1.4rem; margin-bottom: 1.25rem; }
  h1 a { color: var(--fg); text-decoration: none; }
  .drop-zone { border: 2px dashed var(--border); border-radius: 8px; padding: 2.5rem 1.5rem; text-align: center;
               cursor: pointer; transition: border-color 0.2s, background 0.2s; background: var(--card); }
  .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background: var(--hover); }
  .drop-zone .icon { font-size: 2rem; margin-bottom: 0.5rem; }
  .drop-zone .text { color: #656d76; font-size: 0.9rem; }
  .drop-zone .text strong { color: var(--accent); }
  #fileInput { display: none; }
  .preview { margin-top: 1rem; text-align: center; }
  .preview img, .preview video { max-width: 100%; max-height: 300px; border-radius: 6px; border: 1px solid var(--border); }
  .preview .filename { font-size: 0.85rem; color: #656d76; margin-top: 0.5rem; }
  .note { font-size: 0.8rem; color: #656d76; margin-top: 0.5rem; }
  .options { margin-top: 1rem; display: flex; align-items: center; gap: 0.5rem; }
  .options label { color: #656d76; font-size: 0.85rem; cursor: pointer; }
  .options input[type="checkbox"] { width: auto; cursor: pointer; }
  button { margin-top: 1.25rem; padding: 0.5rem 1.5rem; background: #2da44e; border: none; border-radius: 6px;
           color: #fff; font-size: 0.9rem; cursor: pointer; }
  button:hover { background: #218838; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .error { background: #fff0f0; border: 1px solid #cf222e; border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 1rem; color: #cf222e; font-size: 0.85rem; }
  .back { display: inline-block; margin-top: 1rem; color: var(--accent); text-decoration: none; font-size: 0.85rem; }
  .back:hover { text-decoration: underline; }
</style>
</head>
<body>
<h1><a href="{{ base_url }}/">🖼️</a> upload image or video</h1>

<div class="note">Images (jpg, png, gif, webp…) or videos (mp4, mov, m4v…). Max <strong>512 MB</strong> per file.</div>

{% if error %}<div class="error">{{ error }}</div>{% endif %}

<form id="uploadForm" method="post" action="{{ base_url }}/upload" enctype="multipart/form-data">
  <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
    <div class="icon">📁</div>
    <div class="text">Drop a photo or video here or <strong>click to browse</strong></div>
  </div>
  <input type="file" id="fileInput" name="file" accept="image/*,video/*,.mp4,.mov,.m4v,.webm,.mkv">

  <div class="preview" id="preview" style="display:none">
    <img id="previewImg" src="" alt="preview" style="display:none">
    <video id="previewVideo" controls style="display:none"></video>
    <div class="filename" id="fileName"></div>
  </div>

  <div class="options">
    <input type="checkbox" name="unlisted" value="1" id="unlisted">
    <label for="unlisted">Unlisted (won't appear in the gallery)</label>
  </div>

  <button type="submit" id="submitBtn" disabled>Upload</button>
</form>

<a href="{{ base_url }}/" class="back">← back to gallery</a>

<script>
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const preview = document.getElementById('preview');
  const previewImg = document.getElementById('previewImg');
  const previewVideo = document.getElementById('previewVideo');
  const fileName = document.getElementById('fileName');
  const submitBtn = document.getElementById('submitBtn');

  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length) {
      fileInput.files = e.dataTransfer.files;
      handleFile(e.dataTransfer.files[0]);
    }
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) handleFile(fileInput.files[0]);
  });

  function isVideo(file) {
    return file.type.startsWith('video/') || /\.(mp4|mov|m4v|webm|mkv)$/i.test(file.name);
  }
  function isImage(file) {
    return file.type.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp|bmp|tiff|svg)$/i.test(file.name);
  }

  function handleFile(file) {
    if (!isImage(file) && !isVideo(file)) {
      alert('Please select an image or video file.');
      return;
    }
    fileName.textContent = file.name + ' (' + (file.size / 1024 / 1024).toFixed(1) + ' MB)';
    const reader = new FileReader();
    reader.onload = (e) => {
      if (isVideo(file)) {
        previewImg.style.display = 'none';
        previewVideo.src = e.target.result;
        previewVideo.style.display = 'block';
      } else {
        previewVideo.removeAttribute('src');
        previewVideo.style.display = 'none';
        previewImg.src = e.target.result;
        previewImg.style.display = 'block';
      }
      preview.style.display = 'block';
    };
    reader.readAsDataURL(file);
    submitBtn.disabled = false;
  }
</script>
</body>
</html>
